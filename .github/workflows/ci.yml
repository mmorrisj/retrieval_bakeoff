name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Test
        run: pytest -q

      # The smoke benchmark is part of CI on purpose: it exercises index,
      # search, scoring, costing and reporting together, which unit tests do
      # not. It needs no network, no model download and no API key.
      - name: Smoke benchmark
        run: |
          python -m bakeoff run configs/smoke.yaml --out /tmp/smoke
          python -m bakeoff report /tmp/smoke --format markdown
